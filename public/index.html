<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice RAG Assistant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% -20%, #1e3a8a, var(--bg-color) 80%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.6);
        }

        .mic-btn.recording {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, var(--danger), #f43f5e);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status {
            font-weight: 500;
            margin-bottom: 1rem;
            color: #cbd5e1;
            min-height: 24px;
        }

        .result-container {
            display: none;
            text-align: left;
            background: rgba(15, 23, 42, 0.6);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-top: 1rem;
            animation: slideUp 0.4s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field {
            margin-bottom: 1rem;
        }

        .field-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 0.3rem;
        }

        .field-value {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-color);
        }

        .field-value.error { color: var(--danger); }
        
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
        }
        .badge.high { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge.low { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
    </style>
</head>
<body>

    <div class="container">
        <h1>Voice Assistant</h1>
        <p class="subtitle">Powered by Sarvam AI & Groq</p>

        <button id="micBtn" class="mic-btn">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
        
        <div id="status" class="status">Click the mic to speak</div>

        <div id="result" class="result-container">
            <div class="field">
                <div class="field-label">Transcript</div>
                <div id="resQuery" class="field-value">-</div>
            </div>
            <div class="field">
                <div class="field-label">Answer</div>
                <div id="resAnswer" class="field-value" style="font-size: 1.1rem; font-weight: 500;">-</div>
            </div>
            
            <div class="meta-grid">
                <div class="field">
                    <div class="field-label">Sources</div>
                    <div id="resSources" class="field-value" style="font-size: 0.85rem; color: #60a5fa;">-</div>
                    <div class="field-label" style="margin-top: 0.5rem;">Sources snippet</div>
                    <div id="resContext" class="field-value" style="font-size: 0.85rem; color: #cbd5e1;">-</div>
                </div>
                <div>
                    <div class="field" style="margin-bottom: 0.5rem;">
                        <div class="field-label">Best Score</div>
                        <div class="field-value"><span id="resScore" class="badge">-</span></div>
                    </div>
                    <div class="field" style="margin-bottom: 0.5rem;">
                        <div class="field-label">Retrieval Gate</div>
                        <div class="field-value"><span id="resGate" class="badge">-</span></div>
                    </div>
                    <div class="field">
                        <div class="field-label">LLM Called</div>
                        <div class="field-value"><span id="resLLM" class="badge">-</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        micBtn.addEventListener('click', async () => {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = sendAudio;

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                statusEl.textContent = 'Recording... Click again to stop.';
                resultEl.style.display = 'none';
            } catch (err) {
                statusEl.textContent = 'Error accessing microphone: ' + err.message;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            isRecording = false;
            micBtn.classList.remove('recording');
            statusEl.textContent = 'Processing...';
        }

        async function sendAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            if (audioBlob.size < 1000) {
                statusEl.textContent = 'Recording too short.';
                return;
            }

            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.webm');

            try {
                const res = await fetch('http://localhost:3000/api/ask', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                if (!res.ok || data.error) {
                    throw new Error(data.message || data.error || 'Server error');
                }

                showResult(data);
                statusEl.textContent = 'Done.';
            } catch (err) {
                statusEl.textContent = 'Failed: ' + err.message;
            }
        }

        function showResult(data) {
            resultEl.style.display = 'block';
            
            document.getElementById('resQuery').textContent = data.query || 'No query detected';
            document.getElementById('resAnswer').textContent = data.answer || 'No answer generated';
            
            const ctx = data.context || 'No context retrieved';
            document.getElementById('resContext').textContent = ctx;
            
            const sources = data.results && data.results.length > 0 ? 'MSMARCO-XI' : 'None';
            document.getElementById('resSources').textContent = sources;
            
            const score = data.best_score || 0;
            const scoreEl = document.getElementById('resScore');
            if (scoreEl) {
                scoreEl.textContent = score.toFixed(3);
                scoreEl.className = 'badge ' + (score >= 0.5 ? 'high' : 'low');
            }

            const gate = data.retrieval_gate || 'FAIL';
            const gateEl = document.getElementById('resGate');
            if (gateEl) {
                gateEl.textContent = gate;
                gateEl.className = 'badge ' + (gate === 'PASS' ? 'high' : 'low');
            }

            const llm = data.groq_called ? 'YES' : 'NO';
            const llmEl = document.getElementById('resLLM');
            if (llmEl) {
                llmEl.textContent = llm;
                llmEl.className = 'badge ' + (llm === 'YES' ? 'high' : 'low');
            }
        }
    </script>
</body>
</html>
